name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Security problems in zengate are not reported here; use
        [private vulnerability reporting](https://github.com/developingchet/zengate/security/advisories/new)
        as [SECURITY.md](https://github.com/developingchet/zengate/blob/main/SECURITY.md) describes.

        Before pasting logs or a request, remove API keys, backend passwords, request bodies and anything
        private, and never post an unfixed vulnerability in someone else's project here.
  - type: input
    id: version
    attributes:
      label: zengate version
      description: Output of `zengate --version`, the Docker tag, or the commit.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options: [Docker, npm / npx, From source, systemd, Other]
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and Node.js version
      placeholder: Ubuntu 24.04, Node 24.8
  - type: input
    id: client
    attributes:
      label: Client and model
      placeholder: openai-python 2.x, big-pickle
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal request (curl or code) is ideal.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Gateway output, ideally with `LOG_LEVEL=debug`.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: Everything above is free of keys, request bodies and private data, and of unfixed vulnerabilities in someone else's project.
          required: true
        - label: This is not a security problem in zengate itself.
          required: true
