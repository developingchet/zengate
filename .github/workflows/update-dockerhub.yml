name: update-dockerhub

# Re-sync the Docker Hub page from DOCKERHUB.md without cutting a release.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [DOCKERHUB.md]

permissions:
  contents: read

jobs:
  description:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: developingchet/zengate
          readme-filepath: ./DOCKERHUB.md
          short-description: Keyless OpenAI-compatible API for OpenCode Zen free models
