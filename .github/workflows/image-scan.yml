name: image-scan

# Weekly Trivy scan of the image already published on Docker Hub. CI and
# releases scan every image they build; this catches CVEs disclosed after a
# release. Findings go to the Security tab, and the run fails on fixable
# HIGH or CRITICAL vulnerabilities so the failure shows up in Actions.
# Pull requests build and scan their candidate image instead of the old release.

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  pull_request:
    paths: [.github/workflows/image-scan.yml] # test edits to this workflow
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: docker.io/developingchet/zengate:latest

jobs:
  trivy:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    env:
      TRIVY_PLATFORM: linux/${{ matrix.arch }}
      IMAGE: ${{ github.event_name == 'pull_request' && format('zengate:pr-{0}-{1}', github.event.pull_request.number, matrix.arch) || 'docker.io/developingchet/zengate:latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: github.event_name == 'pull_request'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: github.event_name == 'pull_request'
      - name: Build the pull request image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ env.IMAGE }}
      - name: Scan for the Security tab
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
          limit-severities-for-sarif: true
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy-image-${{ matrix.arch }}
      - name: Fail on fixable HIGH or CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true
