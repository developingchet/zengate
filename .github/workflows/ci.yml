name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Socket Firewall (blocks malicious packages during install)
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall
      - name: Install dependencies through the firewall
        shell: bash
        run: |
          sfw npm ci
          # Fail if the wrapper exited without installing anything.
          npm ls --omit=dev --depth=0 > /dev/null
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run audit
      - name: Check the npm package contents
        if: matrix.os == 'ubuntu-latest'
        run: npm pack --dry-run

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: zengate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm zengate:ci node index.js --version
          docker run -d --name zengate -p 127.0.0.1:8083:8083 zengate:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8083/health; then echo; docker rm -f zengate; exit 0; fi
            sleep 2
          done
          docker logs zengate
          exit 1
      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: zengate:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
